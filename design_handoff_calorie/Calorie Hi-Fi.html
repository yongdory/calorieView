<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <title>Calorie · Hi-Fi Designs</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #eaf1e1; }
    body { font-family: 'Gaegu','Quicksand',system-ui,sans-serif; }
    #root { height: 100vh; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <!-- Tweaks (applied to window.CAL_TWEAKS before tokens load) -->
  <script type="text/babel">
    window.CAL_TWEAKS = /*EDITMODE-BEGIN*/{
      "cuteLevel": "cute",
      "paperTone": "warm",
      "dark": false,
      "carb": "#f4b942",
      "protein": "#e07a5f",
      "fat": "#c79fe0",
      "vita": "#6bbf8a",
      "dataState": "normal"
    }/*EDITMODE-END*/;
  </script>

  <script type="text/babel" src="hifi/tokens.jsx"></script>
  <script type="text/babel" src="hifi/components.jsx"></script>
  <script type="text/babel" src="hifi/screens/onboarding.jsx"></script>
  <script type="text/babel" src="hifi/screens/home.jsx"></script>
  <script type="text/babel" src="hifi/screens/gallery.jsx"></script>
  <script type="text/babel" src="hifi/screens/loading.jsx"></script>
  <script type="text/babel" src="hifi/screens/result.jsx"></script>
  <script type="text/babel" src="hifi/screens/history.jsx"></script>
  <script type="text/babel" src="hifi/screens/recipe.jsx"></script>
  <script type="text/babel" src="hifi/screens/profile.jsx"></script>
  <script type="text/babel" src="hifi/screens/web.jsx"></script>
  <script type="text/babel" src="hifi/design-canvas.jsx"></script>

  <script type="text/babel" data-presets="react">
    const T = window.CAL_TWEAKS;

    // ── Tweaks wiring ────────────────────────────────────────────
    function useEditMode() {
      const [active, setActive] = React.useState(false);
      React.useEffect(() => {
        const onMsg = (e) => {
          if (e.data?.type === '__activate_edit_mode') setActive(true);
          if (e.data?.type === '__deactivate_edit_mode') setActive(false);
        };
        window.addEventListener('message', onMsg);
        window.parent.postMessage({ type: '__edit_mode_available' }, '*');
        return () => window.removeEventListener('message', onMsg);
      }, []);
      return active;
    }
    const setKey = (k, v) => {
      window.parent.postMessage({ type: '__edit_mode_set_keys', edits: { [k]: v } }, '*');
      setTimeout(() => window.location.reload(), 100);
    };

    // ── Interactive flow (phone with internal navigation) ────────
    function Flow({ start = 'home' }) {
      const [screen, setScreen] = React.useState(start);
      const [onbStep, setOnbStep] = React.useState(1);

      const onTab = (id) => {
        if (id === 'home') setScreen('home');
        else if (id === 'history') setScreen('history');
        else if (id === 'recipe') setScreen('recipe');
        else if (id === 'profile') setScreen('profile');
        else if (id === 'camera') setScreen('gallery');
      };

      return (
        <window.Phone>
          {screen === 'onboarding' && <window.OnboardingScreen step={onbStep} onNext={() => setOnbStep(s => s+1)} onBack={() => setOnbStep(s => Math.max(1,s-1))} onDone={() => setScreen('home')} />}
          {screen === 'home'       && <window.HomeScreen dataState={T.dataState} onTab={onTab} onPlus={() => setScreen('gallery')} />}
          {screen === 'gallery'    && <window.GalleryScreen onClose={() => setScreen('home')} onAnalyze={() => setScreen('loading')} />}
          {screen === 'loading'    && <window.LoadingScreen onDone={() => setScreen('result')} />}
          {screen === 'result'     && <window.ResultScreen onClose={() => setScreen('home')} onSave={() => setScreen('home')} />}
          {screen === 'history'    && <window.HistoryScreen onTab={onTab} />}
          {screen === 'recipe'     && <window.RecipeScreen onTab={onTab} />}
          {screen === 'profile'    && <window.ProfileScreen onTab={onTab} />}
        </window.Phone>
      );
    }

    // Fixed phone w/ single screen (for static canvas display)
    const FixedPhone = ({ children }) => <window.Phone>{children}</window.Phone>;

    // ── Tweaks Panel ─────────────────────────────────────────────
    function TweaksPanel() {
      const editMode = useEditMode();
      if (!editMode) return null;
      const C = window.CAL;

      const swatch = (key, label) => (
        <div style={{ marginBottom: 10 }}>
          <div style={{ fontSize: 10, fontWeight: 700, color: C.ink55, marginBottom: 4 }}>{label}</div>
          <input type="color" value={T[key]} onChange={(e) => setKey(key, e.target.value)} style={{ width: '100%', height: 28, borderRadius: 8, border: `1px solid ${C.ink15}`, cursor: 'pointer' }} />
        </div>
      );

      const pill = (key, val, label) => (
        <button key={val} onClick={() => setKey(key, val)} style={{
          padding: '6px 10px', borderRadius: 999, fontSize: 11, fontWeight: 700,
          background: T[key] === val ? C.ink : 'transparent', color: T[key] === val ? C.paper : C.ink70,
          border: `1px solid ${T[key] === val ? C.ink : C.ink15}`,
          cursor: 'pointer', fontFamily: 'inherit',
        }}>{label}</button>
      );

      return (
        <div style={{
          position: 'fixed', top: 20, right: 20, width: 248, zIndex: 9999,
          padding: 16, borderRadius: 20, background: C.card,
          border: `1px solid ${C.ink15}`, boxShadow: C.shadowLg, color: C.ink, fontFamily: C.fontSans,
        }}>
          <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: 12 }}>
            <div style={{ fontSize: 18 }}>🌱</div>
            <div className="cal-display" style={{ fontSize: 18, fontWeight: 700 }}>Tweaks</div>
          </div>

          <div style={{ fontSize: 10, fontWeight: 700, color: C.ink55, marginBottom: 5 }}>폰트 세트</div>
          <div style={{ display: 'flex', gap: 4, marginBottom: 12 }}>
            {['cute','balanced','refined'].map(x => pill('cuteLevel', x, x === 'cute' ? '귀엽게' : x === 'balanced' ? '밸런스' : '깔끔'))}
          </div>

          <div style={{ fontSize: 10, fontWeight: 700, color: C.ink55, marginBottom: 5 }}>배경 톤</div>
          <div style={{ display: 'flex', gap: 4, marginBottom: 12 }}>
            {['warm','neutral','cool'].map(x => pill('paperTone', x, x))}
          </div>

          <div style={{ fontSize: 10, fontWeight: 700, color: C.ink55, marginBottom: 5 }}>다크모드</div>
          <div style={{ display: 'flex', gap: 4, marginBottom: 12 }}>
            {[false,true].map(x => pill('dark', x, x ? '🌙 on' : '☀️ off'))}
          </div>

          <div style={{ fontSize: 10, fontWeight: 700, color: C.ink55, marginBottom: 5 }}>데이터 상태</div>
          <div style={{ display: 'flex', gap: 4, marginBottom: 12 }}>
            {['empty','normal','achieved'].map(x => pill('dataState', x, x))}
          </div>

          <div style={{ fontSize: 10, fontWeight: 700, color: C.ink55, marginBottom: 5 }}>영양소 팔레트</div>
          <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 6 }}>
            {swatch('carb', '탄수')}{swatch('protein', '단백')}
            {swatch('fat', '지방')}{swatch('vita', '비타민')}
          </div>
        </div>
      );
    }

    // ── Root ─────────────────────────────────────────────────────
    function Root() {
      return (
        <>
          <TweaksPanel />
          <window.DesignCanvas title="Calorie · Hi-Fi Designs">
            <window.DCSection id="flow" title="🧭 인터랙티브 프로토타입">
              <window.DCArtboard id="flow-main" label="탭해서 이동 · 홈 → 갤러리 → 로딩 → 결과" width={340} height={720}>
                <Flow start="home" />
              </window.DCArtboard>
              <window.DCArtboard id="flow-onb" label="온보딩 플로우 (3 steps)" width={340} height={720}>
                <Flow start="onboarding" />
              </window.DCArtboard>
            </window.DCSection>

            <window.DCSection id="mobile" title="📱 모바일 화면 · 8종">
              <window.DCArtboard id="onb" label="01 · 온보딩 (따뜻한 단계별)" width={340} height={720}>
                <FixedPhone><window.OnboardingScreen step={1} /></FixedPhone>
              </window.DCArtboard>
              <window.DCArtboard id="home" label="02 · 홈 (빅 링 대시보드)" width={340} height={720}>
                <FixedPhone><window.HomeScreen dataState={T.dataState} /></FixedPhone>
              </window.DCArtboard>
              <window.DCArtboard id="gallery" label="03 · 갤러리에서 선택" width={340} height={720}>
                <FixedPhone><window.GalleryScreen /></FixedPhone>
              </window.DCArtboard>
              <window.DCArtboard id="loading" label="04 · 분석 로딩" width={340} height={720}>
                <FixedPhone><window.LoadingScreen /></FixedPhone>
              </window.DCArtboard>
              <window.DCArtboard id="result" label="05 · 결과 (스티커 스타일)" width={340} height={720}>
                <FixedPhone><window.ResultScreen /></FixedPhone>
              </window.DCArtboard>
              <window.DCArtboard id="history" label="06 · 히스토리 (트렌드 라인)" width={340} height={720}>
                <FixedPhone><window.HistoryScreen /></FixedPhone>
              </window.DCArtboard>
              <window.DCArtboard id="recipe" label="07 · 추천 (보충식)" width={340} height={720}>
                <FixedPhone><window.RecipeScreen /></FixedPhone>
              </window.DCArtboard>
              <window.DCArtboard id="profile" label="08 · 프로필 (웰니스)" width={340} height={720}>
                <FixedPhone><window.ProfileScreen /></FixedPhone>
              </window.DCArtboard>
            </window.DCSection>

            <window.DCSection id="web" title="💻 웹">
              <window.DCArtboard id="web-landing" label="랜딩 페이지" width={1280} height={820}>
                <window.WebLanding />
              </window.DCArtboard>
              <window.DCArtboard id="web-dashboard" label="대시보드" width={1280} height={820}>
                <window.WebDashboard />
              </window.DCArtboard>
            </window.DCSection>

            <window.DCSection id="onb-steps" title="🪴 온보딩 각 단계">
              <window.DCArtboard id="onb-1" label="Step 1 · 목표" width={340} height={720}>
                <FixedPhone><window.OnboardingScreen step={1} /></FixedPhone>
              </window.DCArtboard>
              <window.DCArtboard id="onb-2" label="Step 2 · 활동량" width={340} height={720}>
                <FixedPhone><window.OnboardingScreen step={2} /></FixedPhone>
              </window.DCArtboard>
              <window.DCArtboard id="onb-3" label="Step 3 · 식단" width={340} height={720}>
                <FixedPhone><window.OnboardingScreen step={3} /></FixedPhone>
              </window.DCArtboard>
            </window.DCSection>
          </window.DesignCanvas>
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<Root />);
  </script>
</body>
</html>
